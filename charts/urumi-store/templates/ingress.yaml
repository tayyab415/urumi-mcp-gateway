{{- if .Values.ingress.enabled }}
{{- $redirect := and .Values.ingress.redirectToHttps .Values.ingress.tls.enabled }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if $redirect }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-https@kubernetescrd" .Release.Namespace .Release.Name) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-store
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-wordpress
                port:
                  number: 80
{{- if $redirect }}
---
# Traefik middleware: plain HTTP visitors get a permanent redirect to HTTPS.
# WordPress does not do this itself, and a shopper's login or checkout should
# never go over plain HTTP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-https
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- end }}
