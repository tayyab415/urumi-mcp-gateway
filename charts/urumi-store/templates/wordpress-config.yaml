apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-wordpress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
data:
  health.php: |
    {{- .Files.Get "files/health.php" | nindent 4 }}
  php.ini: |
    memory_limit = 256M
    upload_max_filesize = 64M
    post_max_size = 64M
    max_execution_time = 120
