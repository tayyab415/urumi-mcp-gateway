apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  replicas: 1
  # A shared writable WordPress installation must have only one active Pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        {{- include "urumi-store.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/wordpress-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: {{ include "urumi-store.image" .Values.wordpress.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            {{- include "urumi-store.wordpressEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /urumi-health.php?check=live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /urumi-health.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /urumi-health.php?check=live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: content
              mountPath: /var/www/html
            - name: config
              mountPath: /var/www/html/urumi-health.php
              subPath: health.php
              readOnly: true
            - name: config
              mountPath: /usr/local/etc/php/conf.d/urumi.ini
              subPath: php.ini
              readOnly: true
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
        - name: config
          configMap:
            name: {{ .Release.Name }}-wordpress
