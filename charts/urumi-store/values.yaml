# Passwords belong in a pre-existing Kubernetes Secret, never in this file.
credentials:
  existingSecret: urumi-store-credentials

database:
  name: wordpress
  user: wordpress
  image:
    repository: docker.io/library/mariadb
    tag: "11.4.13"
    digest: sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
  persistence:
    size: 8Gi
    # null uses the cluster's default StorageClass; "" requires a static PV.
    storageClass: null
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

wordpress:
  # Include the browser-facing port if it is not 80 or 443.
  publicUrl: http://shop.urumi.test:18080
  image:
    repository: docker.io/library/wordpress
    tag: "7.1.3-php8.3-apache"
    digest: sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5
  persistence:
    size: 8Gi
    storageClass: null
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# A Job that installs WordPress and WooCommerce, then applies these settings.
# Rerunning it is safe.
storeSetup:
  enabled: true
  # true: a Helm hook, run after every install and upgrade, and `helm install
  # --wait` waits for it. false: an ordinary Job that `helm install` creates and
  # returns; the store provisioner uses this and watches the Job itself.
  hook: true
  image:
    repository: docker.io/library/wordpress
    tag: "cli-2.12.0-php8.3"
    digest: sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
