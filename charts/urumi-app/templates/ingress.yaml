{{- /* The only way in from outside the cluster. One hostname; the path decides
       the Service. Traefik tries the longest matching rule first, so
       /api/auth/login and /api/chat win over /api.

       There are five Ingresses rather than one because Traefik attaches
       middlewares (rate limits) per Ingress, and these paths need different
       limits. All five share the hostname and the certificate. Only the first
       carries ingress.annotations, so cert-manager sees one owner for the
       certificate.

       The gateway is also an OAuth authorization server for MCP clients. Its
       paths must reach the gateway, or `/` would answer them with the
       dashboard's HTML and a client's discovery would fail in a confusing way.
       The metadata documents are plain reads. The rest take posts and write
       rows, so they share the login limit.

       The MCP servers have no route here: only the gateway can reach them. */}}
{{- $root := . }}
{{- $traefik := .Values.ingress.traefik }}
{{- $ingresses := list
  (dict "name" "app" "annotations" .Values.ingress.annotations "paths" (list
    (dict "path" "/api" "service" "gateway")
    (dict "path" "/.well-known/oauth-authorization-server" "service" "gateway")
    (dict "path" "/.well-known/oauth-protected-resource" "service" "gateway")
    (dict "path" "/" "service" "dashboard")))
  (dict "name" "login" "limit" "login" "paths" (list
    (dict "path" "/api/auth/login" "type" "Exact" "service" "gateway")
    (dict "path" "/api/auth/demo-login" "type" "Exact" "service" "gateway")))
  (dict "name" "oauth" "limit" "login" "paths" (list
    (dict "path" "/authorize" "service" "gateway")
    (dict "path" "/token" "service" "gateway")
    (dict "path" "/register" "service" "gateway")
    (dict "path" "/revoke" "service" "gateway")
    (dict "path" "/oauth" "service" "gateway")))
  (dict "name" "mcp" "limit" "mcp" "paths" (list
    (dict "path" "/mcp" "service" "gateway")))
  (dict "name" "chat" "limit" "chat" "paths" (list
    (dict "path" "/api/chat" "service" "chat")))
}}
{{- range $ingresses }}
{{- $middlewares := list }}
{{- if and $traefik.enabled $root.Values.ingress.tls.enabled }}
{{- $middlewares = append $middlewares (printf "%s-%s-https@kubernetescrd" $root.Release.Namespace $root.Release.Name) }}
{{- end }}
{{- if and $traefik.enabled .limit (hasKey $traefik.rateLimits (.limit | default "")) }}
{{- $middlewares = append $middlewares (printf "%s-%s-%s-limit@kubernetescrd" $root.Release.Namespace $root.Release.Name .limit) }}
{{- end }}
{{- $annotations := deepCopy (.annotations | default dict) }}
{{- if $middlewares }}
{{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (join "," $middlewares) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $root.Release.Name }}-{{ .name }}
  labels:
    {{- include "urumi-app.labels" $root | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $root.Values.ingress.className }}
  {{- if $root.Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $root.Values.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required when TLS is on" $root.Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $root.Values.host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .type | default "Prefix" }}
            backend:
              service:
                name: {{ $root.Release.Name }}-{{ .service }}
                port: {name: http}
          {{- end }}
{{- end }}
