# Traefik middleware: plain HTTP visitors get a permanent redirect to HTTPS.
# WordPress does not do this itself, and a shopper's login or checkout should
# never go over plain HTTP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: urumi-https
  namespace: urumi-store
  labels:
    app.kubernetes.io/name: urumi-store
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "urumi-store-0.2.0"
spec:
  redirectScheme:
    scheme: https
    permanent: true
