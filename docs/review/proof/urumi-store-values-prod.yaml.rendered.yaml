apiVersion: batch/v1
kind: Job
metadata:
  name: urumi-store-setup
  namespace: urumi-store
  labels:
    app.kubernetes.io/name: urumi-store
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "urumi-store-0.2.0"
    app.kubernetes.io/component: store-setup
  annotations:
    # Helm runs this after every install and upgrade, once the other objects exist.
    helm.sh/hook: post-install,post-upgrade
    # Keep the finished Job so its logs stay readable; replace it on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi-store
        app.kubernetes.io/instance: urumi
        app.kubernetes.io/component: store-setup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        # www-data in the WordPress image, so WordPress can still edit the files this writes.
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      affinity:
        # The WordPress volume is ReadWriteOnce: it can only be mounted on one node.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: urumi
                  app.kubernetes.io/component: wordpress
              topologyKey: kubernetes.io/hostname
      containers:
        - name: wp-cli
          image: "docker.io/library/wordpress:cli-2.12.0-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d"
          imagePullPolicy: IfNotPresent
          command: ["sh", "/setup/store-setup.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WORDPRESS_DB_HOST
              value: urumi-mariadb
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              value: "wordpress"
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urumi-store-credentials
                  key: wordpress-db-password
            - name: WORDPRESS_PUBLIC_URL
              value: "https://shop.example.com"
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', getenv('WORDPRESS_PUBLIC_URL'));
                define('WP_SITEURL', getenv('WORDPRESS_PUBLIC_URL'));
                define('WP_MEMORY_LIMIT', '256M');
                define('WP_MAX_MEMORY_LIMIT', '256M');
            - name: HOME
              value: /tmp
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wp-cli-cache
            - name: STORE_TITLE
              value: "Urumi Sports"
            - name: STORE_ADMIN_USER
              value: "urumi-admin"
            - name: STORE_ADMIN_EMAIL
              value: "admin@example.com"
            - name: STORE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urumi-store-credentials
                  key: wordpress-admin-password
            # Optional so a Secret made before the REST key existed still installs.
            - name: STORE_API_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: urumi-store-credentials
                  key: woo-consumer-key
                  optional: true
            - name: STORE_API_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: urumi-store-credentials
                  key: woo-consumer-secret
                  optional: true
            - name: STORE_COUNTRY
              value: "IN:MH"
            - name: STORE_CURRENCY
              value: "INR"
            - name: WOOCOMMERCE_VERSION
              value: "11.2.1"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: content
