# Source: urumi-app/templates/chat-agent.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-chat
  labels:
    app.kubernetes.io/name: urumi-app
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: urumi-app-0.1.0
    app.kubernetes.io/component: chat
spec:
  # One replica: conversations and approvals waiting for a click live in memory.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urumi-app
      app.kubernetes.io/instance: urumi
      app.kubernetes.io/component: chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi-app
        app.kubernetes.io/instance: urumi
        app.kubernetes.io/component: chat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat-agent
          image: urumi/chat-agent:d75e0dafae0f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Chat reaches tools only through the gateway, with the user's own
            # chat token, so its calls are checked and audited as that user.
            - name: GATEWAY_MCP_URL
              value: "http://urumi-gateway:8080/mcp"
            - name: CHAT_MODEL
              value: "us.moonshotai.kimi-k3"
            - name: AWS_REGION
              value: "us-east-1"
            - name: HOME
              value: /tmp
            # The Bedrock credential: either a Bedrock API key, or an access key
            # that signs short-lived Bedrock keys. Optional, so the rest of the
            # system installs before one exists; chat then reports the error.
            - name: AWS_BEARER_TOKEN_BEDROCK
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: bedrock-api-key
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: aws-secret-access-key
                  optional: true
          # /healthz checks neither the gateway nor Bedrock. An outage there is
          # an error in the chat, not a reason to restart this Pod.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 25m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

