# Source: urumi-app/templates/dashboard.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-dashboard
  labels:
    app.kubernetes.io/name: urumi-app
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: urumi-app-0.1.0
    app.kubernetes.io/component: dashboard
spec:
  # Static files only, so any number of replicas works.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urumi-app
      app.kubernetes.io/instance: urumi
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi-app
        app.kubernetes.io/instance: urumi
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid 101 is nginx in the unprivileged nginx image.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: urumi/dashboard:f57bc6c52806
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx keeps its pid file and temporary files in /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

