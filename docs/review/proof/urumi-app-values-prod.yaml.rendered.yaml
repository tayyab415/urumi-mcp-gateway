# Source: urumi-app/templates/traefik-middlewares.yaml
# Up to `burst` requests at once, refilled at `average` per `period`. Past
# that, Traefik answers 429 without calling the Service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: urumi-chat-limit
  labels:
    app.kubernetes.io/name: urumi-app
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: urumi-app-0.1.0
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 20
    # One allowance per value of this header, e.g. per API key.
    sourceCriterion:
      requestHeaderName: Authorization

