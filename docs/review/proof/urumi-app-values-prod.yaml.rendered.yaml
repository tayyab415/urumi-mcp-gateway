# Source: urumi-app/templates/woo-mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-woo-mcp
  labels:
    app.kubernetes.io/name: urumi-app
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: urumi-app-0.1.0
    app.kubernetes.io/component: woo-mcp
spec:
  # Stateless (MCP over HTTP with JSON responses), so a replaced Pod loses nothing.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: urumi-app
      app.kubernetes.io/instance: urumi
      app.kubernetes.io/component: woo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi-app
        app.kubernetes.io/instance: urumi
        app.kubernetes.io/component: woo-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: urumi/woo-mcp:5cd0370ea512
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # woo-mcp calls WordPress over plain HTTP inside the cluster, so
            # WordPress rebuilds the signed URL as http://<home host>/..., even
            # when the public store is HTTPS. Sign that, with OAuth 1.0a
            # (WooCommerce accepts Basic auth only over HTTPS).
            - name: WOO_STORE_URL
              value: "http://shop.example.com"
            - name: WOO_AUTH
              value: oauth1
            - name: WOO_API_URL
              value: "http://urumi-wordpress.urumi-store.svc.cluster.local"
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: woo-consumer-key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: woo-consumer-secret
            - name: WOO_TIMEOUT_SECONDS
              value: "15"
          # /healthz does not call WooCommerce. A slow store shows up as tool
          # errors and an "unreachable" status, not as restarts of this Pod.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

