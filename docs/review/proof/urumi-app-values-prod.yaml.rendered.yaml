# Source: urumi-app/templates/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-gateway
  labels:
    app.kubernetes.io/name: urumi-app
    app.kubernetes.io/instance: urumi
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: urumi-app-0.1.0
    app.kubernetes.io/component: gateway
spec:
  # One replica: SQLite allows one writer, and the volume mounts on one node.
  replicas: 1
  strategy:
    # The old Pod lets go of the volume before the new one starts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: urumi-app
      app.kubernetes.io/instance: urumi
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: urumi-app
        app.kubernetes.io/instance: urumi
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: urumi/gateway:157760e5b528
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: sqlite+aiosqlite:////data/gateway.db
            - name: GATEWAY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: gateway-secret-key
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: "admin@example.com"
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: admin-password
            - name: BOOTSTRAP_SERVERS_FILE
              value: /etc/urumi/servers.json
            - name: SHIPPING_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: shipping-api-token
            - name: SUPPLIER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: urumi-app-secrets
                  key: supplier-api-key
            - name: PUBLIC_URL
              value: "https://app.example.com"
            # /mcp checks the Host header (DNS-rebinding protection). The public
            # hostname comes from PUBLIC_URL; chat calls the in-cluster Service name.
            - name: MCP_ALLOWED_HOSTS
              value: "urumi-gateway:8080,urumi-gateway"
            - name: COOKIE_SECURE
              value: "true"
            - name: DEFAULT_UPSTREAM_TIMEOUT_SECONDS
              value: "10"
          # /readyz checks the gateway's own database only. A dead upstream makes
          # its own tools fail; it must not take the gateway out of the Service.
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bootstrap
              mountPath: /etc/urumi
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: urumi-gateway-data
        - name: bootstrap
          configMap:
            name: urumi-gateway-bootstrap
        - name: tmp
          emptyDir: {}

