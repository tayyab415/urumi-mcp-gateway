# Static files only. In the cluster, Ingress sends /api, /api/chat and /mcp to
# the gateway and chat services before a request ever reaches this server.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  # The app is client-routed: every page path serves index.html.
  location / { try_files $uri /index.html; }

  # Long cache for hashed assets, none for the HTML shell.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
}
