[project]
name = "chat-agent"
version = "0.1.0"
description = "Dashboard chat agent: OpenAI Agents SDK on Bedrock, reaching tools only through the MCP gateway"
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.24.0",
    "aws-bedrock-token-generator==1.1.0",
    "mcp==2.3.0",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real model on Bedrock (set RUN_LIVE_BEDROCK=1)"]
