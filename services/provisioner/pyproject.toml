[project]
name = "urumi-provisioner"
version = "0.1.0"
description = "Creates and deletes WooCommerce stores, each in its own Kubernetes namespace, with Helm"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "kubernetes>=31",
    "anyio>=4.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provisioner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
