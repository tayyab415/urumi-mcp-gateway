[project]
name = "woo-mcp"
version = "0.1.0"
description = "MCP server exposing WooCommerce products and orders over Streamable HTTP"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
