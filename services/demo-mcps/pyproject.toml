[project]
name = "demo-mcps"
version = "0.1.0"
description = "Two small MCP servers (shipping quotes, supplier restocking) with simulated data"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_mcps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
