[project]
name = "urumi-gateway"
version = "0.1.0"
description = "Team MCP gateway: one authenticated MCP endpoint over several upstream MCP servers"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "aiomysql>=0.2",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
